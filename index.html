
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon bassin</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1422;color:#f3f7ff;
 font-family:Arial,sans-serif;padding:24px
}
main{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;
 align-items:center;gap:12px;border-bottom:1px solid #25354a;
 padding-bottom:20px;flex-wrap:wrap}
h1{font-size:clamp(28px,4vw,44px);margin:0}
.sub{color:#aebfd5;margin-top:7px}
.status{color:#58d99b;font-size:14px}
.layout{display:grid;grid-template-columns:1.4fr 1fr;
 gap:24px;margin-top:25px;align-items:center}
.tank-wrap{padding:10px;min-width:0}
.tank{
 height:440px;max-width:480px;margin:auto;position:relative;
 border:7px solid #aab9c7;border-radius:16px 16px 20px 20px;
 background:linear-gradient(90deg,#637c91,#d2e0e9 12%,
 #8199aa 25%,#4c6479 80%,#c1d0dc);
 box-shadow:inset 0 0 20px #07101c,0 12px 35px #0008;
 overflow:hidden
}
.tank:before{
 content:"";position:absolute;z-index:3;top:0;left:-5px;right:-5px;
 height:18px;border:5px solid #c9d6e0;border-radius:8px;
 background:linear-gradient(#d9e4ec,#566b7d)
}
.tank:after{
 content:"";position:absolute;z-index:4;inset:0;
 border-left:12px solid #d4e1ea66;
 border-right:12px solid #34495b99;pointer-events:none
}
.water{
 position:absolute;left:0;right:0;bottom:0;height:44.5%;
 background:linear-gradient(90deg,#0073a9,#08a9e7 45%,#006ba8);
 transition:height 1.4s ease;
 box-shadow:inset 0 9px 18px #7be2ff55
}
.wave{
 position:absolute;top:-8px;left:-50%;width:200%;height:18px;
 border-radius:45%;background:#46d2ff99;
 animation:wave 5s linear infinite
}
.wave.two{top:-3px;opacity:.5;animation-duration:7s}
@keyframes wave{to{transform:translateX(25%)}}
.frame{
 position:absolute;z-index:5;inset:0;pointer-events:none;
 background:repeating-linear-gradient(to bottom,
 transparent 0,transparent 24%,#e2edf533 25%,transparent 26%);
 border-left:5px solid #dce7ef99;border-right:5px solid #dce7ef99
}
.scale{
 position:absolute;z-index:6;left:12px;top:28px;bottom:20px;
 display:flex;flex-direction:column;justify-content:space-between;
 color:white;font-size:12px;text-shadow:0 1px 3px #001
}
.scale span:before{content:"";display:inline-block;width:13px;
 border-top:2px solid white;margin-right:5px;vertical-align:middle}
.base{height:24px;max-width:500px;margin:auto;
 background:linear-gradient(#687b8d,#1b2938);
 border-radius:3px 3px 10px 10px;box-shadow:0 10px 18px #0008}
.cards{display:grid;gap:14px}
.card{padding:23px;border:1px solid #273950;
 border-radius:14px;background:linear-gradient(135deg,#152338,#101a2a)}
.label{color:#aebfd5;font-size:15px}
.value{font-size:clamp(28px,4vw,42px);font-weight:bold;
 margin-top:10px;letter-spacing:.3px}
.bar{height:9px;background:#29384c;border-radius:20px;
 margin-top:18px;overflow:hidden}
.bar div{height:100%;width:44.5%;background:#26a8f4;
 border-radius:20px;transition:width 1.4s}
footer{text-align:center;color:#8095ad;font-size:12px;margin-top:20px}
@media(max-width:680px){
 body{padding:15px}.layout{grid-template-columns:1fr;gap:10px}
 .tank{height:350px}.tank-wrap{padding:5px}
 .card{padding:17px}.value{font-size:32px}
}
</style>
</head>
<body>
<main>
<header>
 <div>
  <h1>💧 Mon bassin</h1>
  <div class="sub">Niveau d’eau en temps réel</div>
 </div>
 <div class="status">● Affichage du bassin</div>
</header>

<section class="layout">
 <div class="tank-wrap">
  <div class="tank">
   <div class="water" id="water">
    <div class="wave"></div>
    <div class="wave two"></div>
   </div>
   <div class="frame"></div>
   <div class="scale">
    <span>100 %</span><span>75 %</span>
    <span>50 %</span><span>25 %</span><span>0 %</span>
   </div>
  </div>
  <div class="base"></div>
 </div>

 <div class="cards">
  <div class="card">
   <div class="label">💧 Volume actuel</div>
   <div class="value" id="litres">1 000 L</div>
   <div class="bar"><div id="bar"></div></div>
  </div>
  <div class="card">
   <div class="label">◉ Niveau de remplissage</div>
   <div class="value" id="pct">44,5 %</div>
  </div>
  <div class="card">
   <div class="label">▣ Capacité maximale</div>
   <div class="value">2 246 L</div>
  </div>
 </div>
</section>
<footer id="updated">Démonstration — données non connectées</footer>
</main>

<script>
const CAPACITE=2246;

function afficherNiveau(valeur){
 const litres=Math.max(0,Math.min(CAPACITE,Number(valeur)));
 if(!Number.isFinite(litres))return;
 const p=litres/CAPACITE*100;
 document.getElementById("water").style.height=p+"%";
 document.getElementById("litres").textContent=
  Math.round(litres).toLocaleString("fr-CA")+" L";
 document.getElementById("pct").textContent=
  p.toLocaleString("fr-CA",{maximumFractionDigits:1})+" %";
 document.getElementById("bar").style.width=p+"%";
 document.getElementById("updated").textContent=
  "Dernière mise à jour visuelle : "+new Date().toLocaleTimeString("fr-CA");
}

// Valeur de démonstration : la connexion Datacake sera ajoutée ensuite.
const API_URL = "https://bassin-datacake-api.pegrenier.workers.dev/";

async function actualiserNiveau() {
  try {
    const reponse = await fetch(API_URL, { cache: "no-store" });

    if (!reponse.ok) {
      throw new Error("Erreur HTTP " + reponse.status);
    }

    const donnees = await reponse.json();
    afficherNiveau(Number(donnees.litres));
  } catch (erreur) {
    console.error("Erreur de lecture du bassin :", erreur);
    document.getElementById("updated").textContent =
      "Connexion temporairement indisponible";
  }
}

actualiserNiveau();
setInterval(actualiserNiveau, 5 * 60 * 1000);
</script>
</body>
</html>
