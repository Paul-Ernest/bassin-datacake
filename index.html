
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1422">
<title>Reservoir H2O</title>

<style>
* { box-sizing: border-box; }

:root {
  --fond: #0b1422;
  --panneau: #132238;
  --texte: #f3f7ff;
  --secondaire: #aebfd5;
  --bleu: #27bdf5;
  --vert: #58d99b;
}

body {
  margin: 0;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 0%, #193652 0%, transparent 55%),
    var(--fond);
  color: var(--texte);
  font-family: Arial, sans-serif;
}

main { max-width: 1100px; margin: auto; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #30445d;
  padding-bottom: 20px;
  flex-wrap: wrap;
}

h1 {
  font-size: clamp(28px, 4vw, 44px);
  margin: 0;
  letter-spacing: -1px;
}

.sub { color: var(--secondaire); margin-top: 8px; }

.status {
  color: var(--vert);
  font-size: 14px;
  background: #58d99b12;
  border: 1px solid #58d99b40;
  border-radius: 30px;
  padding: 9px 13px;
}

.layout {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 24px;
  margin-top: 25px;
  align-items: center;
}

.tank-wrap { padding: 10px; min-width: 0; }

.tank {
  height: 440px;
  max-width: 480px;
  margin: auto;
  position: relative;
  isolation: isolate;
  border: 2px solid #d2dbe0;
  border-radius: 20px 20px 28px 28px;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 32px,
      #ffffff0a 33px,
      #ffffff0a 35px
    ),
    linear-gradient(
      90deg,
      #53616b 0%,
      #8e9aa2 5%,
      #c5cdd1 12%,
      #8e9ba3 20%,
      #64737d 43%,
      #a8b4ba 68%,
      #d6dcdf 88%,
      #78858d 96%,
      #424f59 100%
    );
  box-shadow:
    inset 10px 0 16px #17232c88,
    inset -12px 0 18px #18232c99,
    inset 0 0 0 5px #ffffff15,
    0 22px 40px #0008;
  overflow: hidden;
}

/* Rebords épais de la cuve */
.tank:before {
  content: "";
  position: absolute;
  z-index: 9;
  top: 0;
  left: 0;
  right: 0;
  height: 20px;
  border-bottom: 3px solid #465660;
  background: linear-gradient(
    #f1f4f5 0%,
    #b9c3c8 30%,
    #788791 70%,
    #d9e0e3 100%
  );
  box-shadow: 0 3px 7px #0006;
}

/* Reflets et relief des parois */
.tank:after {
  content: "";
  position: absolute;
  z-index: 7;
  inset: 0;
  border-left: 13px solid #f1f7fa42;
  border-right: 13px solid #17242c55;
  border-radius: inherit;
  pointer-events: none;
}

.water {
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  bottom: 0;
  height: 44.5%;
  overflow: hidden;
  background:
    linear-gradient(
      180deg,
      #8beaff 0%,
      #3bd0fa 7%,
      #12b9ef 24%,
      #079bd8 62%,
      #0576b2 100%
    );
  box-shadow:
    inset 0 8px 16px #e0fcff90,
    inset 0 -14px 22px #00558a55;
  transition: height 1.4s ease;
}

/* Lumière qui traverse l'eau */
.water:before {
  content: "";
  position: absolute;
  top: 0;
  left: -40%;
  width: 180%;
  height: 100%;
  background: repeating-linear-gradient(
    110deg,
    transparent 0%,
    transparent 12%,
    #ffffff0a 13%,
    #ffffff22 14%,
    transparent 18%,
    transparent 30%
  );
  animation: reflets 9s linear infinite;
}

/* Ondulations de surface */
.wave {
  position: absolute;
  z-index: 2;
  top: -9px;
  left: -50%;
  width: 200%;
  height: 20px;
  border-radius: 45%;
  background: #c5f7ffb0;
  box-shadow: 0 3px 9px #d6fbff66;
  animation: vague 5s linear infinite;
}

.wave.two {
  top: -5px;
  opacity: .48;
  animation-duration: 7s;
  animation-direction: reverse;
}

/* Petites bulles */
.bubble {
  position: absolute;
  bottom: -15px;
  width: 7px;
  height: 7px;
  border: 1px solid #d9fbff9c;
  border-radius: 50%;
  background: #d9fbff30;
  animation: bulles 7s linear infinite;
}

.b1 { left: 24%; animation-delay: 0s; }
.b2 { left: 66%; width: 5px; height: 5px; animation-delay: 2s; }
.b3 { left: 82%; width: 9px; height: 9px; animation-delay: 4s; }

@keyframes vague {
  to { transform: translateX(25%); }
}

@keyframes reflets {
  to { transform: translateX(15%); }
}

@keyframes bulles {
  0% { transform: translateY(0); opacity: 0; }
  15% { opacity: .65; }
  85% { opacity: .4; }
  100% { transform: translateY(-340px); opacity: 0; }
}

/* Petit poisson orange dessiné en CSS */
.poisson {
  position: absolute;
  z-index: 4;
  left: 12%;
  top: 55%;
  width: 66px;
  height: 38px;
  pointer-events: none;
  filter: drop-shadow(0 3px 4px #00334c88);
  animation: nagePoisson 12s ease-in-out infinite alternate;
}

.poisson-corps {
  position: absolute;
  inset: 5px 12px 5px 4px;
  border: 1px solid #ffcf80;
  border-radius: 55% 48% 48% 55%;
  background: linear-gradient(
    180deg,
    #ffe0a0 0%,
    #ffad45 35%,
    #ff8526 70%,
    #e65d17 100%
  );
  box-shadow:
    inset 0 3px 3px #fff9,
    inset 0 -3px 4px #b9461744;
}

.poisson-queue {
  position: absolute;
  right: 0;
  top: 8px;
  width: 0;
  height: 0;
  border-top: 11px solid transparent;
  border-bottom: 11px solid transparent;
  border-right: 17px solid #ff922e;
  filter: drop-shadow(0 1px 1px #8a390c);
  transform-origin: right center;
  animation: remueQueue .35s ease-in-out infinite alternate;
}

.poisson-nageoire {
  position: absolute;
  z-index: 2;
  top: 1px;
  left: 27px;
  width: 17px;
  height: 12px;
  background: #ffc66a;
  border: 1px solid #f98a2c;
  border-radius: 100% 0 60% 0;
  transform: rotate(-15deg);
}

.poisson-oeil {
  position: absolute;
  z-index: 3;
  top: 11px;
  left: 12px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #182538;
  border: 1px solid white;
  box-shadow: 0 0 2px #fff;
}

/* La nage se fait horizontalement; la hauteur est contrôlée par JavaScript */
@keyframes nagePoisson {
  0% {
    left: 12%;
    transform: scaleX(1) translateY(0);
  }
  45% {
    transform: scaleX(1) translateY(-4px);
  }
  50% {
    transform: scaleX(-1) translateY(-4px);
  }
  100% {
    left: 72%;
    transform: scaleX(-1) translateY(0);
  }
}

@keyframes remueQueue {
  from { transform: rotate(-15deg); }
  to { transform: rotate(15deg); }
}

/* Graduations de la cuve */
.frame {
  position: absolute;
  z-index: 5;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 24%,
    #e2edf533 25%,
    transparent 26%
  );
  border-left: 5px solid #dce7ef55;
  border-right: 5px solid #dce7ef55;
}

.scale {
  position: absolute;
  z-index: 6;
  left: 12px;
  top: 29px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: white;
  font-size: 12px;
  text-shadow: 0 1px 3px #001;
  pointer-events: none;
}

.scale span:before {
  content: "";
  display: inline-block;
  width: 13px;
  border-top: 2px solid white;
  margin-right: 5px;
  vertical-align: middle;
}

.base {
  height: 24px;
  max-width: 500px;
  margin: auto;
  background: linear-gradient(#87949b, #46545e 40%, #1b2938);
  border: 1px solid #9ba8b0;
  border-radius: 3px 3px 10px 10px;
  box-shadow: 0 10px 18px #0008;
}

.cards { display: grid; gap: 14px; }

.card {
  padding: 23px;
  border: 1px solid #30445d;
  border-radius: 16px;
  background: linear-gradient(135deg, #172a40, #101a2a);
  box-shadow: 0 9px 25px #0002;
}

.label { color: var(--secondaire); font-size: 15px; }

.value {
  font-size: clamp(28px, 4vw, 42px);
  font-weight: bold;
  margin-top: 10px;
  letter-spacing: .3px;
  font-variant-numeric: tabular-nums;
}

.bar {
  height: 10px;
  background: #29384c;
  border-radius: 20px;
  margin-top: 18px;
  overflow: hidden;
}

.bar div {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #087fc1, #31d0ff);
  border-radius: 20px;
  transition: width 1.4s ease;
  box-shadow: 0 0 12px #26a8f477;
}

footer {
  text-align: center;
  color: #8095ad;
  font-size: 12px;
  margin-top: 20px;
}

@media(max-width:680px) {
  body { padding: 15px; }
  .layout { grid-template-columns: 1fr; gap: 10px; }
  .tank { height: 350px; }
  .tank-wrap { padding: 5px; }
  .card { padding: 17px; }
  .value { font-size: 32px; }
}

@media(prefers-reduced-motion:reduce) {
  .poisson, .poisson-queue, .wave, .bubble,
  .water:before { animation: none; }
}
</style>
</head>

<body>
<main>

<header>
  <div>
    <h1>💧 Reservoir H2O</h1>
    <div class="sub">Niveau d’eau en temps réel</div>
  </div>
  <div class="status">● Surveillance du bassin</div>
</header>

<section class="layout">
  <div class="tank-wrap">
    <div class="tank">

      <div class="water" id="water">
        <div class="wave"></div>
        <div class="wave two"></div>
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
      </div>

      <div class="poisson" id="poisson" aria-hidden="true">
        <div class="poisson-nageoire"></div>
        <div class="poisson-corps"></div>
        <div class="poisson-queue"></div>
        <div class="poisson-oeil"></div>
      </div>

      <div class="frame"></div>

      <div class="scale">
        <span>100 %</span>
        <span>75 %</span>
        <span>50 %</span>
        <span>25 %</span>
        <span>0 %</span>
      </div>

    </div>
    <div class="base"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="label">💧 Volume total estimé</div>
      <div class="value" id="litres">-- L</div>
      <div class="bar"><div id="bar"></div></div>
    </div>

    <div class="card">
      <div class="label">◉ Niveau de remplissage</div>
      <div class="value" id="pct">-- %</div>
    </div>

    <div class="card">
      <div class="label">▣ Capacité maximale</div>
      <div class="value">2 257 L</div>
    </div>
  </div>
</section>

<footer id="updated">Connexion à Datacake...</footer>

</main>

<script>
const CAPACITE = 2257;
const API_URL = "https://bassin-datacake-api.pegrenier.workers.dev/";

const poisson = document.getElementById("poisson");
const eau = document.getElementById("water");

function positionnerPoisson(pourcentage) {
  // Cache le poisson si l'eau est trop basse pour le garder immergé.
  if (pourcentage < 15) {
    poisson.style.visibility = "hidden";
    return;
  }

  poisson.style.visibility = "visible";

  // Le poisson se place juste sous la surface de l'eau.
  const haut = Math.min(88, Math.max(12, 100 - pourcentage + 6));
  poisson.style.top = haut + "%";
}

function afficherNiveau(valeur) {
  const litres = Number(valeur);

  if (!Number.isFinite(litres)) return;

  const litresLimites = Math.max(0, Math.min(CAPACITE, litres));
  const p = litresLimites / CAPACITE * 100;

  eau.style.height = p + "%";

  document.getElementById("litres").textContent =
    Math.round(litresLimites).toLocaleString("fr-CA") + " L";

  document.getElementById("pct").textContent =
    p.toLocaleString("fr-CA", { maximumFractionDigits: 1 }) + " %";

  document.getElementById("bar").style.width = p + "%";

  positionnerPoisson(p);

  document.getElementById("updated").textContent =
    "Dernière mise à jour : " +
    new Date().toLocaleTimeString("fr-CA");
}

async function actualiserNiveau() {
  try {
    const reponse = await fetch(API_URL, { cache: "no-store" });

    if (!reponse.ok) {
      throw new Error("Erreur HTTP " + reponse.status);
    }

    const donnees = await reponse.json();
    const litresCapteur = Number(donnees.litres);

    if (!Number.isFinite(litresCapteur)) {
      throw new Error("Valeur de litres invalide");
    }

    // Le capteur mesure un bassin de 1000 L.
    // Estimation pour les trois bassins, capacité totale de 2257 L.
    const litresTotal = litresCapteur * 2.257;

    afficherNiveau(litresTotal);

  } catch (erreur) {
    console.error("Erreur de lecture du bassin :", erreur);
    document.getElementById("updated").textContent =
      "Connexion temporairement indisponible";
  }
}

actualiserNiveau();
setInterval(actualiserNiveau, 5 * 60 * 1000);
</script>

</body>
</html>
